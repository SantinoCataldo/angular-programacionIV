<section class="add-movie-page">
  <div class="form-container">
    <div class="form-header">
      <a routerLink="/movies" class="back-link">Volver al catalogo</a>
      <h2>Agregar nueva pelicula</h2>
      <p class="subtitle">Completa los datos para sumar una peli</p>
    </div>

    <form [formGroup]="movieForm" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-group">
        <label for="title">Titulo de la pelicula</label>
        <input 
          id="title" 
          type="text" 
          formControlName="title" 
          placeholder="Ej: El Padrino"
          [class.is-invalid]="title?.invalid && title?.touched"
        />
        @if (title?.invalid && title?.touched) {
          <div class="error-msg">El titulo es obligatorio</div>
        }
      </div>

      <div class="form-group">
        <label for="category">Categoria</label>
        <select 
          id="category" 
          formControlName="category"
          [class.is-invalid]="category?.invalid && category?.touched"
        >
          <option value="" disabled>Selecciona una categoria</option>
          @for (cat of categories; track cat) {
            <option [value]="cat">{{ cat }}</option>
          }
        </select>
        @if (category?.invalid && category?.touched) {
          <div class="error-msg">Elegi una categoria</div>
        }
      </div>

      <div class="form-group">
        <label for="imageUrl">Link de la imagen</label>
        <input 
          id="imageUrl" 
          type="text" 
          formControlName="imageUrl" 
          placeholder="https://ejemplo.com/poster.jpg"
          [class.is-invalid]="imageUrl?.invalid && imageUrl?.touched"
        />
        @if (imageUrl?.invalid && imageUrl?.touched) {
          <div class="error-msg">La imagen es obligatoria</div>
        }
      </div>

      <div class="form-group">
        <label for="description">Descripcion (opcional)</label>
        <textarea 
          id="description" 
          formControlName="description" 
          rows="3" 
          placeholder="De que trata la peli..."
        ></textarea>
      </div>

      <button type="submit" [disabled]="movieForm.invalid">
        Guardar pelicula
      </button>
    </form>
  </div>
</section>
